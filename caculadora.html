<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Calculadora - Suma</title>
</head>
<body>
    <h1>Calculadora Básica</h1>
    
    <div>
        <input type="number" id="num1" placeholder="Número 1">
        <span>+</span>
        <input type="number" id="num2" placeholder="Número 2">
        <button onclick="sumar()">Sumar</button>
    </div>

    <h2>Resultado: <span id="resultado">0</span></h2>

    <script>
        function sumar() {
            // Obtener los valores de los inputs
            let n1 = parseFloat(document.getElementById('num1').value) || 0;
            let n2 = parseFloat(document.getElementById('num2').value) || 0;
            
            // Calcular la suma
            let suma = n1 + n2;
            
            // Mostrar el resultado en el DOM
            document.getElementById('resultado').innerText = suma;
        }
    </script>
</body>
</html>
